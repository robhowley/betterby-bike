name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or finalize release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
          path: betterby-bike

      - name: Check out released tag
        if: ${{ steps.release.outputs['betterby-bike--release_created'] == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs['betterby-bike--tag_name'] }}

      - name: Archive bundle
        if: ${{ steps.release.outputs['betterby-bike--release_created'] == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs['betterby-bike--tag_name'] }}
        run: |
          archive="betterby-bike-${RELEASE_TAG}.tar.gz"
          tar -czf "$archive" betterby-bike raw-sources

      - name: Upload bundle
        if: ${{ steps.release.outputs['betterby-bike--release_created'] == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs['betterby-bike--tag_name'] }}
        run: gh release upload "$RELEASE_TAG" "betterby-bike-${RELEASE_TAG}.tar.gz"
